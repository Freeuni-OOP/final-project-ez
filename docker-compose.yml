# One command to run the whole project locally:
#   docker compose up --build
#
# This compose file currently brings up the frontend. As the backend lands
# (Spring Boot + PostgreSQL), new services are added here so the same single
# command spins up the full stack.
services:
  frontend:
    build: .
    container_name: algorythm-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
