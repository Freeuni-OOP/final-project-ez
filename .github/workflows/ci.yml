name: CI

# Runs on every pull request to main (and on pushes to main after merge).
# A red check here means the PR isn't safe to merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel an in-progress run for a branch when a new commit is pushed to it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles, runs the unit + Testcontainers integration tests, and packages
      # the jar. The runner ships with Docker, so Testcontainers can start Postgres.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
