spring.application.name=algorythm-backend

# HTTP port. Overridable via the SERVER_PORT env var (handy for Docker).
server.port=${SERVER_PORT:8080}

# Database (PostgreSQL). Connection details come from env so the same build works
# in Docker (pointed at the db service) and locally (falls back to localhost).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/algorythm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:algorythm}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:algorythm}

# Flyway owns the schema, so Hibernate only validates entities against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT signing secret + token lifetime. The secret comes from APP_JWT_SECRET (a
# long, random value in real environments); the default here is for local dev only.
# HS256 requires at least 32 characters.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}


# Basic rate limiting per caller IP on auth + write endpoints (fixed window).
# Tuned so normal use never trips it; override via env in production.
app.ratelimit.enabled=${APP_RATELIMIT_ENABLED:true}
app.ratelimit.auth-max=${APP_RATELIMIT_AUTH_MAX:10}
app.ratelimit.write-max=${APP_RATELIMIT_WRITE_MAX:60}
app.ratelimit.window-seconds=${APP_RATELIMIT_WINDOW_SECONDS:60}
